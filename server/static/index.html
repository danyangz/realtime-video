<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地 AI 应用</title>
  <style>
    :root { --bg: #0e1016; --card: #161922; --line: #2a2f3f; --text: #e8ebf4; --muted: #8a92a6; --accent: #5b8def; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    main { max-width: 880px; margin: 0 auto; padding: 56px 16px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p.sub { margin: 0 0 32px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    a.card {
      display: block; padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
      color: inherit; text-decoration: none; transition: border-color 0.2s, transform 0.1s;
    }
    a.card:hover { border-color: var(--accent); }
    a.card:active { transform: scale(0.99); }
    .emoji { font-size: 34px; }
    .card h2 { margin: 12px 0 6px; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>本地 AI 应用</h1>
    <p class="sub">选一个开始。全部基于开源模型。</p>
    <div class="grid" id="apps"></div>
  </main>
  <script>
    fetch('/api/apps').then((r) => r.json()).then((apps) => {
      const grid = document.getElementById('apps');
      for (const a of apps) {
        const el = document.createElement('a');
        el.className = 'card';
        el.href = `/${a.slug}/`;
        el.innerHTML = `<div class="emoji"></div><h2></h2><p></p>`;
        el.querySelector('.emoji').textContent = a.emoji;
        el.querySelector('h2').textContent = a.title;
        el.querySelector('p').textContent = a.description;
        grid.appendChild(el);
      }
    });
  </script>
</body>
</html>
