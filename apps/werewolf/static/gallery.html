<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色一览</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #121522; color: #e9ecf5; font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    h2 { margin: 24px 0 12px; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { background: #1a1e2e; border: 1px solid #2d3348; border-radius: 14px; padding: 8px; text-align: center; }
    .big { height: 170px; border-radius: 10px; background: radial-gradient(120% 95% at 50% 18%, #ffe3c4 0%, #f7b3a6 42%, #a07ad8 88%); }
    .big svg { height: 100%; width: 100%; display: block; }
    .mini { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; margin: 8px auto 4px; }
    .mini svg { width: 100%; height: 100%; display: block; }
    .name { font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="module">
    import { Avatar, fakeLevels } from '/shared/avatar.js';
    const casts = await (await fetch('casts')).json();
    const root = document.getElementById('root');
    const speaking = new URLSearchParams(location.search).has('speaking');
    for (const c of casts) {
      const h = document.createElement('h2');
      h.textContent = `${c.title}（法官：${c.judge.name}）`;
      root.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      root.appendChild(grid);
      const people = [{ name: c.judge.name, look: c.judge.look, color: '#888' }, ...c.personas, { name: '你', look: c.human_look, color: '#eee' }];
      for (const p of people) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="big"></div><div class="mini" style="background:${p.color}"></div><div class="name"></div>`;
        card.querySelector('.name').textContent = p.name;
        grid.appendChild(card);
        const a = new Avatar(card.querySelector('.big'), { look: p.look, getLevels: fakeLevels });
        if (speaking) a.setState('speaking');
        new Avatar(card.querySelector('.mini'), { look: p.look, mini: true });
      }
    }
  </script>
</body>
</html>
